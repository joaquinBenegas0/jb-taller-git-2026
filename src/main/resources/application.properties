spring.application.name=jb-taller-git-2026

# Base H2 en memoria: vive dentro del proceso Java y se llama cs2db
spring.datasource.url=jdbc:h2:mem:cs2db;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate crea las tablas al arrancar y las borra al apagar
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Consola web de H2 para ver las tablas
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Puerto configurable para levantar los tres servicios del grupo en una sola máquina
server.port=${PORT:8080}

# OpenAPI 3 (springdoc): JSON en /v3/api-docs, YAML en /v3/api-docs.yaml, interfaz en /swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
# Las respuestas de error se documentan en cada endpoint, no se copian los handlers a todos
springdoc.override-with-generic-response=false

# Round robin POO-09: servicios de los compañeros que consulta el escenario.
# La URL se pisa con las variables de entorno A2_URL y A3_URL; las rutas salen del OpenAPI de cada uno.
companeros.a2.nombre=Matías Jara (Vanzfranhait)
companeros.a2.url=${A2_URL:http://localhost:8082}
companeros.a2.ruta-disparo-rapido=${A2_RUTA:/api/reglas/disparo-rapido}
companeros.a3.nombre=Marcelo Kropff (Pomona06)
companeros.a3.url=${A3_URL:http://localhost:8083}
companeros.a3.ruta-impacto=${A3_RUTA:/api/reglas/impacto}
